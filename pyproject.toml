[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-roi-explorer"
version = "1.0.0"
description = "Quantify the business case for automating manual back-office processes."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dimitres Kisimov" }]
requires-python = ">=3.10"
dependencies = []  # core model is standard-library only

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
# Only needed to build the executive one-pager (scripts/make_onepager.py).
deliverables = ["matplotlib>=3.5"]

[project.scripts]
roi-model = "roi_model.cli:main"

[tool.setuptools]
packages = ["roi_model"]

[tool.setuptools.package-data]
roi_model = ["data/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
