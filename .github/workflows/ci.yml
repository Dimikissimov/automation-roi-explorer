name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev tooling
        run: python -m pip install --upgrade pip ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q

      - name: CLI smoke test
        run: python -m roi_model

      - name: Export + validate JSON and CSV
        run: |
          python -m roi_model --export-json out.json --export-csv out.csv
          python - <<'PY'
          import csv, json, sys
          data = json.load(open("out.json", encoding="utf-8"))
          assert isinstance(data, list) and len(data) == 5, "expected 5 JSON rows"
          assert {"name", "annual_net_saving", "payback_months", "roi_3y_pct"} <= data[0].keys()
          with open("out.csv", encoding="utf-8") as fh:
              rows = list(csv.DictReader(fh))
          assert len(rows) == 5, "expected 5 CSV rows"
          print("JSON/CSV validation OK:", len(data), "processes")
          PY
