<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="940" height="560" fill="#ffffff"/>
<text x="28" y="44" font-size="21" font-weight="700" fill="#1a2332">Phased-rollout cumulative cashflow &#8212; Invoice matching (3-way)</text>
<text x="28" y="70" font-size="12.5" fill="#5b6672">Cumulative euros over 36 months with a linear 6-month adoption ramp, against the idealised full-benefit line.</text>
<text x="28" y="88" font-size="12.5" fill="#5b6672">The automation pays the running cost in full from month 1 but earns the saving only as adoption climbs &#8212; so it turns cash-positive later.</text>
