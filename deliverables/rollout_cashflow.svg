<text x="28" y="516" font-size="11.5" font-weight="600" fill="#1a2332">Read: a 6-month adoption ramp pushes payback to month 6 (+3.2 mo vs the idealised 2.8) and costs 37,188 EUR of 3-year net benefit (436,712 ramped vs 473,900).</text>
<text x="28" y="536" font-size="10.5" fill="#5b6672">The linear ramp is an illustrative assumption on synthetic data, not a measured adoption curve. Generated by the real ROI model &#8212; reproduce with `python -m roi_model --rollout`.</text>
