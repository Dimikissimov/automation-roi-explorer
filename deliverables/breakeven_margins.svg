<text x="454.0" y="488" font-size="10.5" fill="#5b6672" text-anchor="middle">150</text>
<line x1="540.0" y1="110" x2="540.0" y2="470" stroke="#d0d7de" stroke-width="1"/>
<text x="540.0" y="488" font-size="10.5" fill="#5b6672" text-anchor="middle">200</text>
<line x1="626.0" y1="110" x2="626.0" y2="470" stroke="#d0d7de" stroke-width="1"/>
<text x="626.0" y="488" font-size="10.5" fill="#5b6672" text-anchor="middle">250</text>
<text x="411.0" y="506" font-size="10.5" fill="#5b6672" text-anchor="middle" font-style="italic">headroom before break-even (% of base value)</text>
<text x="28" y="134" font-size="12.5" font-weight="600" fill="#1a2332">Manual min/task</text>
<text x="28" y="150" font-size="10.5" fill="#5b6672">4 &#8594; 0.9</text>
<rect x="196" y="126" width="133.2" height="20" rx="3" fill="#b45309"/>
<text x="642" y="140.0" font-size="11.5" font-weight="700" fill="#b45309">77% drop  ▲ tightest margin</text>
<text x="28" y="184" font-size="12.5" font-weight="600" fill="#1a2332">Annual volume</text>
<text x="28" y="200" font-size="10.5" fill="#5b6672">120,000 &#8594; 13,803.92</text>
<rect x="196" y="176" width="152.2" height="20" rx="3" fill="#1f6feb"/>
<text x="642" y="190.0" font-size="11.5" font-weight="400" fill="#1a2332">88% drop</text>
<text x="28" y="234" font-size="12.5" font-weight="600" fill="#1a2332">Hourly wage</text>
<text x="28" y="250" font-size="10.5" fill="#5b6672">30 &#8594; 3.45</text>
<rect x="196" y="226" width="152.2" height="20" rx="3" fill="#1f6feb"/>
<text x="642" y="240.0" font-size="11.5" font-weight="400" fill="#1a2332">88% drop</text>
<text x="28" y="284" font-size="12.5" font-weight="600" fill="#1a2332">Coverage</text>
<text x="28" y="300" font-size="10.5" fill="#5b6672">85% &#8594; 10%</text>
<rect x="196" y="276" width="152.2" height="20" rx="3" fill="#1f6feb"/>
<text x="642" y="290.0" font-size="11.5" font-weight="400" fill="#1a2332">88% drop</text>
