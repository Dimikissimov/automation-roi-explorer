<svg xmlns="http://www.w3.org/2000/svg" width="940" height="564" viewBox="0 0 940 564" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="940" height="564" fill="#ffffff"/>
<text x="28" y="44" font-size="21" font-weight="700" fill="#1a2332">Margin of safety &#8212; Invoice matching (3-way)</text>
<text x="28" y="70" font-size="12.5" fill="#5b6672">How far each assumption can move before the 3-year case stops paying back. Longer bar = more headroom;</text>
<text x="28" y="88" font-size="12.5" fill="#5b6672">the shortest bar is the assumption the decision is most fragile to. Axis capped at 250%; longer bars labelled with the true value.</text>
