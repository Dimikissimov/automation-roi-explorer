<text x="642" y="440.0" font-size="11.5" font-weight="400" fill="#1a2332">2,194% rise</text>
<text x="28" y="528" font-size="11.5" font-weight="600" fill="#1a2332">Read: most fragile to Manual min/task — the case breaks even when it falls to 0.9 (a 77% move from 4). Base 3-year net benefit 473,900 EUR.</text>
<text x="28" y="548" font-size="10.5" fill="#5b6672">Margins are tolerances on synthetic, illustrative assumptions, not probabilities. Generated by the real ROI model &#8212; reproduce with `python -m roi_model --breakeven`.</text>
</svg>
