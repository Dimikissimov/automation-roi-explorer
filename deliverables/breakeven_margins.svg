<text x="28" y="350" font-size="10.5" fill="#5b6672">0.5 &#8594; 3.6</text>
<rect x="196" y="326" width="430.0" height="20" rx="3" fill="#1f6feb"/>
<path d="M618.0 329 L624.0 336.0 L618.0 343" fill="none" stroke="#ffffff" stroke-width="2"/>
